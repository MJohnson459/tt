[package]
name = "timetracker"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Michael Johnson"]
license = "MIT"
description = "A minimal time tracker for contractors"
repository = "https://github.com/MJohnson459/tt"
readme = "README.md"
keywords = ["time-tracking", "contractor", "invoicing", "cli", "billing"]
categories = ["command-line-utilities"]

[[bin]]
name = "tt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
interim = { version = "0.2.1", features = ["chrono_0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
