[package]
name = "timetracker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A minimal time tracker for contractors"

[[bin]]
name = "tt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
